vynik = "An old address with a slash at its end (/services/, /news/group/) was redirected in two hops: first to its form without the slash, then by its redirect. A redirect is now followed at once from any form of its address, one hop as search engines need. Found on michalevic.org after its old service addresses were imported."

[[zapis]]
faza = "ściah"
"cełaść" = 0
adras = [2,2]
vynik = "A site names the people it writes about in site.json schema.people: names per language, other names, the item of the page about them, and what schema.org says of a person. An author field with any of their names becomes a reference to one person by @id (the site's address with #key) and the page about them; that page gives the person in full with the addresses of the site's own domain, so no text holds a domain of its own; \"#key\" in the organization (its founder) is the same reference. For michalevic.org, where Ales Michalevic is named as Ales (Alaksiej), Alexey or Aleś. 27 tests, 162 assertions."

[[zapis]]
faza = "ściah"
"cełaść" = 0
adras = [2,2]
vynik = "Built the images as the owner of Legal Status decided (17 Nov 2026). media.add keeps an image once as AVIF, upright, without metadata, no larger than site.json media.max_side (2000 px by default), named by the checksum of what was sent; the original is not kept; a host that cannot write AVIF refuses images. /media/w<width>/ab/<sha>.avif, a width of the ladder 160 to 2000, is made on first request and written for the web server; jobs:run keeps that cache within media_cache_files and media_cache_mb once an hour, the copies asked for longest ago going first. A page's img of the library gets srcset, sizes, width, height, lazy loading and its alt in the page's language; image() for templates. bin/ramonak media:add takes files from disk, op reads json from stdin with -. On the Legal Status hosting Imagick cannot write AVIF and GD can: a 320 px copy of a 205 KB JPEG is 9.8 KB, made in 0.09 s. 32 tests, 186 assertions."

