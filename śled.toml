vynik = "A form keeps its entries no longer than its declaration says: keep_days of a form in site.json, and jobs:run deletes older entries, mailed or not. For michalevic.org, whose privacy policy, by the owner, keeps a request a year after the last contact. 33 tests, 189 assertions."

[[zapis]]
faza = "ściah"
"cełaść" = 0
adras = [2,2]
vynik = "Videos, for the owner of Legal Status, who wants more of them and no visitor sent to YouTube unasked: an iframe of YouTube in a rendered page becomes a figure with the cover from the site's own media library, the title from YouTube's oEmbed, a link to the video and the player of youtube-nocookie.com in data-video, which the site's script puts in place on a click. The first page that shows a video queues the job video.cover, which fetches its title and cover once, keeps the cover through media.add and clears the built pages of the site. A text made from a recording or an article names it in the structured data (isBasedOn from source_url). Form entries are expired once a month, not hourly: they are kept for a year. 34 tests, 197 assertions."
