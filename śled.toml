[[zapis]]
faza = "ściah"
"cełaść" = 0
adras = [2,2]
vynik = "The architecture of the first slice written in docs/architecture.md: PHP 8.2 with no framework, Twig, MariaDB with SQLite for tests; a kernel that composes modules declared in module.php and refuses conflicting claims; immutable item versions with origin (source, edited, machine) and publications as the only public state, rollback as a new publication; kinds of content declared in the site's repository; operations shared by agents, a later administration and an API, each change with an event; agents act through a tool site of the frame's Klučnik, which signs requests and passes the member's level; the SEO contract and noindex on experimental installations by default; machine translation through Klučnik's model route, stopped by an edited version and marking it stale on a newer source; releases switched by a symlink through Klučnik's hosting connection. The connections it needs were added to Klučnik first: Google (plyn-one/plyn.klucnik whole 89), DNS and cPanel hosting (whole 95)."

[[zapis]]
faza = "ściah"
"cełaść" = 0
adras = [2,2]
vynik = "The first slice of code: Db over PDO with one schema for MariaDB and SQLite (migrations/001-core.sql), Sites from site.json compiled for OPcache, items and immutable versions with their origin, publications with rollback and reviews, routes that keep old addresses as one-hop 301s, Twig rendering with the SEO head (title, description, canonical, hreflang and x-default only for published languages, robots), sitemap.xml and robots.txt closed on an experimental installation, built pages sent by the web server and removed by what they were made from, seventeen operations with levels and an event each, the signed bridge for Klučnik with a five-minute window and single-use nonces, the queue and the translation job that an edited version stops and marks stale. Nine tests with 60 assertions pass on SQLite. Through Apache with mod_rewrite on loopback: a built page 0.38 ms at p50 (0.50 at p95), the same page rendered by PHP 1.27 ms, a redirect 1.00 ms; the cache folder is not reachable by its own address, and noindex is on the built files too."

[[zapis]]
faza = "ściah"
"cełaść" = 0
adras = [2,2]
vynik = "Asked by the owner whether publication is tied to Russian: it is not meant to be, and one place made it so; fixed. The source language is the item's own, the language its first text was written in; a text in another language is a translation (edited) unless the caller says it is now the source; every other language of the site with machine translation on gets a machine version at the source path under its prefix, the default language included; x-default falls back to the first published language when the default has none. A test writes an item first in English and gets it in Russian and Belarusian: 10 tests, 65 assertions."

[[zapis]]
faza = "ściah"
"cełaść" = 0
adras = [2,2]
vynik = "The owner decided for michalevic.org: every language with its prefix, Russian too (/ru/…), the old unprefixed addresses kept as 301s to the Russian pages, and English for a visitor whose language the site does not have. A site whose languages all have prefixes now answers its root with a 302 by Accept-Language and its q-values, else its default language, with Vary: Accept-Language and never as a built file; the home pages name the root as x-default, other pages their version in the default language. Tested on the example site prefixed: 11 tests, 75 assertions."

[[zapis]]
faza = "ściah"
"cełaść" = 0
adras = [2,2]
vynik = "A review of SEO with the owner, from Google's and Yandex's documentation, the changes of 2025-2026 (FAQ rich results ended on 7 May 2026; no special markup or llms.txt for AI features) and what practitioners and the 2024 leak add (click satisfaction, a site-level quality, Yandex's behavioural and commercial factors). The owner decided: machine translations are indexed only after review by an agent or several. Added: a machine version is closed to search engines until site.json machine_reviews distinct reviewers found it ok_for_now and none needs_work; JSON-LD of the organization and of a kind's schema type with the article's own date and the true dates of publication; scheduled publication and its cancellation; IndexNow on every publication, move and removal, never from an experimental installation; https and lower case as the one form of an address. 14 tests, 93 assertions."

[[zapis]]
faza = "ściah"
"cełaść" = 0
adras = [2,2]
vynik = "The owner corrected the dates: a reader cares on what date a material was true, not when it reached a server; old articles of the site, interviews and posts are published with their own dates, and a material revised in substance shows its date of update. dateModified is now the field updated when the material was revised, else its date; a move or a republication dates nothing; the time of publication on this server stays an internal record and the sitemap's lastmod. 14 tests, 94 assertions."

[[zapis]]
faza = "ściah"
"cełaść" = 0
adras = [2,2]
vynik = "Read with the owner: five Russian guides at the top of search for technical SEO (sostav.ru twice, kokoc, habr, ingate) and the features of Yoast SEO Premium. New for the engine and added: Yandex Clean-param for campaign parameters, security headers (HSTS outside an experimental installation, nosniff, SAMEORIGIN, referrer policy), compression and a year of cache for versioned assets, Open Graph type, site name and image with a Twitter card, and the operation seo.audit (orphans, broken links and links through redirects, missing, duplicate and long titles and descriptions, missing dates, translations waiting for review), the counterpart of what Yoast sells. Outdated in those guides and left out: Host and Crawl-delay, Original texts of Yandex, FID, keyword density and LSI, TIC, a canonical of later list pages to the first, frames and Flash. 15 tests, 102 assertions."
