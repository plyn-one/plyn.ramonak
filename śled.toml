[[zapis]]
faza = "ściah"
"cełaść" = 0
adras = [2,2]
vynik = "The architecture of the first slice written in docs/architecture.md: PHP 8.2 with no framework, Twig, MariaDB with SQLite for tests; a kernel that composes modules declared in module.php and refuses conflicting claims; immutable item versions with origin (source, edited, machine) and publications as the only public state, rollback as a new publication; kinds of content declared in the site's repository; operations shared by agents, a later administration and an API, each change with an event; agents act through a tool site of the frame's Klučnik, which signs requests and passes the member's level; the SEO contract and noindex on experimental installations by default; machine translation through Klučnik's model route, stopped by an edited version and marking it stale on a newer source; releases switched by a symlink through Klučnik's hosting connection. The connections it needs were added to Klučnik first: Google (plyn-one/plyn.klucnik whole 89), DNS and cPanel hosting (whole 95)."

[[zapis]]
faza = "ściah"
"cełaść" = 0
adras = [2,2]
vynik = "The first slice of code: Db over PDO with one schema for MariaDB and SQLite (migrations/001-core.sql), Sites from site.json compiled for OPcache, items and immutable versions with their origin, publications with rollback and reviews, routes that keep old addresses as one-hop 301s, Twig rendering with the SEO head (title, description, canonical, hreflang and x-default only for published languages, robots), sitemap.xml and robots.txt closed on an experimental installation, built pages sent by the web server and removed by what they were made from, seventeen operations with levels and an event each, the signed bridge for Klučnik with a five-minute window and single-use nonces, the queue and the translation job that an edited version stops and marks stale. Nine tests with 60 assertions pass on SQLite. Through Apache with mod_rewrite on loopback: a built page 0.38 ms at p50 (0.50 at p95), the same page rendered by PHP 1.27 ms, a redirect 1.00 ms; the cache folder is not reachable by its own address, and noindex is on the built files too."

[[zapis]]
faza = "ściah"
"cełaść" = 0
adras = [2,2]
vynik = "Asked by the owner whether publication is tied to Russian: it is not meant to be, and one place made it so; fixed. The source language is the item's own, the language its first text was written in; a text in another language is a translation (edited) unless the caller says it is now the source; every other language of the site with machine translation on gets a machine version at the source path under its prefix, the default language included; x-default falls back to the first published language when the default has none. A test writes an item first in English and gets it in Russian and Belarusian: 10 tests, 65 assertions."
